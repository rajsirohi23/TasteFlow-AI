<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Display · TasteFlow</title>
  <link rel="stylesheet" href="css/console.css" />
  <link rel="stylesheet" href="css/board.css" />
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script>TasteFlowSession.guard(["kitchen","owner"]);</script>
  <script src="js/board.js" defer></script>
</head>
<body class="board-page">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">T</span><span>tasteflow<span class="dot">.</span> <small>Kitchen display</small></span></a>
    <div class="meter" id="meter" aria-live="polite">
      <span class="level light" id="m-level">–</span>
      <span><b id="m-active">0</b> active</span>
      <span><b id="m-late">0</b> late</span>
      <span>wait ≈ <b id="m-wait">0</b> min</span>
    </div>
    <nav aria-label="Pages"><a href="agents.html">Agent Console</a><a href="command.html">Command Center</a><a href="owner.html">Owner</a></nav>
    <label class="switch"><input type="checkbox" id="sound" /> <span>New-order sound</span></label>
  </header>
  <main class="board" aria-label="Kitchen order board">
    <section class="col" data-status="pending"><h2>New <span class="count" id="c-pending">0</span></h2><div class="cards" id="col-pending"></div></section>
    <section class="col" data-status="preparing"><h2>Preparing <span class="count" id="c-preparing">0</span></h2><div class="cards" id="col-preparing"></div></section>
    <section class="col" data-status="ready"><h2>Ready for pickup <span class="count" id="c-ready">0</span></h2><div class="cards" id="col-ready"></div></section>
  </main>
  <p class="foot" id="foot">Connecting…</p>
</body>
</html>
